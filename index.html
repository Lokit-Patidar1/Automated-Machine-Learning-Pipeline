<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoML Pipeline</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --accent: #38bdf8;
      --muted: #94a3b8;
      --card: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e293b, var(--bg));
      color: var(--fg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .card {
      max-width: 720px;
      background: linear-gradient(135deg, #0b1220, var(--card));
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 0.5rem; font-size: 2.2rem; }
    p { margin: 0.5rem 0 1.2rem; color: var(--muted); line-height: 1.6; }
    .cta {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: #0b1220;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
    code { background: #0b1220; padding: 0.2rem 0.4rem; border-radius: 6px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>AutoML Pipeline</h1>
    <p>This repository hosts a Streamlit app for EDA, model training, and exporting trained models. GitHub Pages needs an <code>index.html</code>, so this page is a simple landing screen.</p>
    <p>To run locally: <code>pip install -r deps.txt</code> and <code>streamlit run app_dashboard.py</code>.</p>
  </main>
</body>
</html>
